server {
    listen 80;
    server_name venuapi.cims.cognilabs.org;
    return 301 https://$host$request_uri;  # Redirect HTTP to HTTPS
}

server {
    listen 443 ssl;
    server_name venuapi.cims.cognilabs.org;

    ssl_certificate /etc/letsencrypt/live/venuapi.cims.cognilabs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venuapi.cims.cognilabs.org/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://venucms_fastapi:8000;  # FastAPI'ga so'rovlarni yuborish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
